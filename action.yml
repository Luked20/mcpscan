name: 'mcpscan'
description: 'Security scanner for MCP servers and agent skills'
branding: { icon: 'shield', color: 'red' }
inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
  fail-on:
    description: 'critical | high | medium | low | none'
    required: false
    default: 'high'
  sarif-file:
    description: 'Path of the generated SARIF file, relative to the workspace'
    required: false
    default: 'mcpscan.sarif'
outputs:
  sarif-file:
    description: 'Path of the generated SARIF file'
    value: ${{ inputs['sarif-file'] }}
runs:
  using: 'composite'
  steps:
    # Builds mcpscan from the ref the consumer pinned, rather than installing a
    # package from npm.
    #
    # The previous version ran `npx --yes mcpscan@${{ github.action_ref }}`,
    # which had two problems. It did not work — `mcpscan` is not published, so
    # every run failed with "No matching version". And if anyone ever published
    # a package under that name, this action would have downloaded and executed
    # *their* code with the consumer's workflow permissions. Building from
    # `github.action_path` — the checkout of this repository at the pinned ref —
    # means the code that runs is the code the consumer pinned, and nothing else.
    #
    # `npm ci` needs the devDependencies (tsup, typescript) because `dist/` is
    # not committed. That is a deliberate trade: ~20s per run, against the
    # standing risk of a committed build artifact silently drifting from source.
    - name: Build mcpscan from the pinned ref
      shell: bash
      env:
        MCPSCAN_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cd "$MCPSCAN_ACTION_PATH"
        npm ci
        npm run build

    # Runs in the consumer's workspace, so `path` and `sarif-file` are relative
    # to their repository, not to the action's checkout.
    #
    # No `set -e` guard around the scan itself: mcpscan exits 1 when it finds
    # something at or above `fail-on`, and that exit code has to reach the step
    # so the job reflects it. See the README on why 1 and 2 are not the same.
    - name: Scan
      shell: bash
      env:
        MCPSCAN_ACTION_PATH: ${{ github.action_path }}
        MCPSCAN_PATH: ${{ inputs.path }}
        MCPSCAN_FAIL_ON: ${{ inputs['fail-on'] }}
        MCPSCAN_SARIF_FILE: ${{ inputs['sarif-file'] }}
      run: |
        set -uo pipefail
        node "$MCPSCAN_ACTION_PATH/dist/cli.js" "$MCPSCAN_PATH" \
          --format sarif --output "$MCPSCAN_SARIF_FILE" --fail-on "$MCPSCAN_FAIL_ON"
        status=$?
        # 0 = clean, 1 = findings at or above fail-on, 2 = the scan could not run.
        # All three are forwarded verbatim; a workflow that treats 2 as 0 would
        # report a broken scan as a clean one.
        exit "$status"
